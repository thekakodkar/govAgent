# Local Postgres for the govagent-platform control plane.
# The password below is a local-development default only. Do not reuse it anywhere else.
# govagent_owner and govagent_app are created by Alembic, not by this file.

name: govagent-platform

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: govagent_platform
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d govagent_platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  platform-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: govagent-platform:0.3.0
    ports:
      - "8070:8070"
    environment:
      PLATFORM_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/govagent_platform
      PLATFORM_APP_DATABASE_URL: postgresql+psycopg://govagent_app:govagent_app_local@postgres:5432/govagent_platform
      PLATFORM_SESSION_SECRET: local-dev-only-change-me
      PLATFORM_ENVIRONMENT: local
      PLATFORM_LLM_PROVIDER: scripted
    depends_on:
      postgres:
        condition: service_healthy
