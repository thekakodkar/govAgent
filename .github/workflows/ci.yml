name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry
      - name: Install package
        run: poetry install --with dev --extras "crewai enterprise" --no-interaction --no-ansi
      - name: Ruff
        run: poetry run ruff check src/govagent
      - name: Mypy
        run: poetry run mypy src/govagent

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            extras: "enterprise"
            pytest_args: "--ignore=tests/test_crewai_adapter.py"
          - python-version: "3.11"
            extras: "crewai enterprise"
            pytest_args: ""
          - python-version: "3.12"
            extras: "crewai enterprise"
            pytest_args: ""
          - python-version: "3.13"
            extras: "crewai enterprise"
            pytest_args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pip install poetry
      - name: Install package
        run: poetry install --with dev --extras "${{ matrix.extras }}" --no-interaction --no-ansi
      - name: Download spaCy model
        run: poetry run python -m spacy download en_core_web_lg
      - name: Test
        run: poetry run pytest -v --tb=short --asyncio-mode=auto ${{ matrix.pytest_args }}
      - name: Wheel layout
        if: matrix.python-version == '3.12'
        run: poetry run pytest tests/test_wheel_layout.py -v --tb=short
